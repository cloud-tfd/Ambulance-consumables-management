name: 🚑 救護耗材自動寄信提醒

# ============================================================
# 觸發方式（三種，任一個觸發都會執行同一套「時間/頻率/是否已寄」檢查）：
#
# 1) repository_dispatch (type: scheduled-check)
#    ★ 由外部排程服務 (cron-job.org) 準時呼叫，約 1~2 分鐘內開跑，這是「準時」的主力。
# 2) schedule (cron)
#    GitHub 內建排程，僅作為備援。GitHub 官方說明高負載時會延遲甚至跳過，不能保證準時。
# 3) workflow_dispatch
#    手動按 Run workflow 測試（會跳過時間檢查，直接寄信）。
# ============================================================
on:
  repository_dispatch:
    types: [scheduled-check]
  schedule:
    - cron: "7,22,37,52 0-15 * * *"   # 備援：台灣 08:07~23:52 每 15 分鐘
  workflow_dispatch:

# 同一時間只允許一個執行，避免多個觸發同時跑而重複寄信
concurrency:
  group: ems-reminder
  cancel-in-progress: false

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      # ubuntu-latest 已內建 Node 20，不需另外 setup-node（省下約 10~20 秒）
      - name: 📨 執行耗材到期提醒發信腳本
        env:
          FIREBASE_URL: ${{ secrets.FIREBASE_URL }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          BOT_EMAIL: ${{ secrets.BOT_EMAIL }}
          BOT_PASSWORD: ${{ secrets.BOT_PASSWORD }}
          EMAILJS_SERVICE_ID: ${{ secrets.EMAILJS_SERVICE_ID }}
          EMAILJS_TEMPLATE_ID: ${{ secrets.EMAILJS_TEMPLATE_ID }}
          EMAILJS_PUBLIC_KEY: ${{ secrets.EMAILJS_PUBLIC_KEY }}
          EMAILJS_PRIVATE_KEY: ${{ secrets.EMAILJS_PRIVATE_KEY }}
          RECIPIENT_EMAILS: ${{ secrets.RECIPIENT_EMAILS }}
        run: node .github/scripts/send-reminder.js
