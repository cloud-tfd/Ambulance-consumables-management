name: 🚑 救護耗材自動寄信提醒 (每小時自動輪詢檢查)

# ============================================================
# 執行排程：每天 08:00 ~ 23:00 (台灣時間) 每小時整點自動檢查
# (UTC 00:00 ~ 15:00，對應台灣時間 UTC+8 為 08:00 ~ 23:00)
# 只要到達您在網頁上設定的時間，當天就會自動發送一次提醒信！
# ============================================================
on:
  schedule:
    - cron: "7,22,37,52 0-15 * * *"  # 台灣 08:07~23:52，每15分鐘輪詢，錯開整點佇列
  workflow_dispatch:        # 亦支援手動點擊 Run workflow 測試

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 📨 執行耗材到期提醒發信腳本
        env:
          FIREBASE_URL: ${{ secrets.FIREBASE_URL }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          BOT_EMAIL: ${{ secrets.BOT_EMAIL }}
          BOT_PASSWORD: ${{ secrets.BOT_PASSWORD }}
          EMAILJS_SERVICE_ID: ${{ secrets.EMAILJS_SERVICE_ID }}
          EMAILJS_TEMPLATE_ID: ${{ secrets.EMAILJS_TEMPLATE_ID }}
          EMAILJS_PUBLIC_KEY: ${{ secrets.EMAILJS_PUBLIC_KEY }}
          EMAILJS_PRIVATE_KEY: ${{ secrets.EMAILJS_PRIVATE_KEY }}
          RECIPIENT_EMAILS: ${{ secrets.RECIPIENT_EMAILS }}
        run: node .github/scripts/send-reminder.js
